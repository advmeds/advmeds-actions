name: Release Please

on:
  workflow_call:
    inputs:
      target-branch:
        description: release-please 要追蹤並開 release PR 的分支
        type: string
        required: true
    secrets:
      PERSONAL_ACCESS_TOKEN:
        required: true
    outputs:
      release-created:
        description: 這次執行是否建立了 release（'true' 或空字串）
        value: ${{ jobs.release-please.outputs.release-created }}
      major:
        description: 新 release 的 major 版號
        value: ${{ jobs.release-please.outputs.major }}
      sha:
        description: 新 release 指向的 commit
        value: ${{ jobs.release-please.outputs.sha }}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      major: ${{ steps.release.outputs.major }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
          target-branch: ${{ inputs.target-branch }}
